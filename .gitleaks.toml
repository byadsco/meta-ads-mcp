# gitleaks config for meta-ads-mcp.
#
# Extends the upstream default ruleset (AWS, GCP, GitHub, Stripe, Twilio,
# Slack, etc.) with project-specific rules that catch leaks of the secrets
# this server actually handles. See .env.example for the full list.
#
# Update CLAUDE.md and ~/.claude/skills/pre-deploy-guard/scripts/scan-secrets.sh
# in tandem when adding rules here so the local guard and CI agree.
#
# The scanner version is pinned in .gitleaks-version and read by both CI
# (.github/workflows/ci.yml) and the local guard. Keep them on the same
# version — gitleaks releases genuinely disagree about allowlist semantics.

title = "meta-ads-mcp gitleaks rules"

[extend]
useDefault = true

# ──────────────────────────────────────────────────────────────────────
# Project-specific rules — all are tightened to the actual production
# format (hex length, etc.) so identifier-only false-positives (e.g.
# `META_APP_SECRET = originalAppSecret`) don't trigger.
# ──────────────────────────────────────────────────────────────────────

[[rules]]
id = "meta-app-secret-assignment"
description = "Meta App Secret assigned to META_APP_SECRET (32-char hex)"
regex = '''(?i)META_APP_SECRET\s*[:=]\s*["']?[A-Fa-f0-9]{32}["']?'''
tags = ["meta", "secret"]

[[rules]]
id = "meta-access-token"
description = "Meta long-lived access token (EAA prefix, ≥40 chars total)"
# Real EAA tokens are well over 100 chars; require ≥40 to skip dummy
# fixtures like "EAA-test-token-fixture" while still catching real leaks.
regex = '''EAA[A-Za-z0-9]{40,}'''
tags = ["meta", "token"]

[[rules]]
id = "apify-api-token"
description = "Apify API token (apify_api_ prefix)"
# Real tokens are apify_api_ + ~36 base62 chars; require ≥20 to skip short
# fixtures like "apify_api_bogus" while still catching real leaks.
regex = '''apify_api_[A-Za-z0-9]{20,}'''
tags = ["apify", "token"]

[[rules]]
id = "meta-tokens-json"
description = "Meta multi-tenant tokens JSON map containing real EAA tokens"
regex = '''(?i)META_TOKENS\s*[:=]\s*["']?\{[^}]*EAA[A-Za-z0-9]{40,}'''
tags = ["meta", "token"]

[[rules]]
id = "oauth-secret-assignment"
description = "MCP OAuth signing secret (≥32 base64-ish chars)"
regex = '''(?i)OAUTH_SECRET\s*[:=]\s*["']?[A-Za-z0-9+/=]{32,}["']?'''
tags = ["oauth", "secret"]

[[rules]]
id = "oauth-approval-pin"
description = "MCP OAuth approval PIN (deprecated — should never appear)"
# Quoted form OR unquoted value terminated by EOL/whitespace/punctuation.
# The unquoted branch's trailing `[^.A-Za-z0-9_]` rejects identifier
# references like `OAUTH_APPROVAL_PIN: process.env.X` that would otherwise
# false-positive on the next identifier characters. RE2 (Go) does not
# support lookahead, so we use alternation.
regex = '''(?i)OAUTH_APPROVAL_PIN\s*[:=]\s*(?:["'][A-Za-z0-9]{6,}["']|[A-Za-z0-9]{6,}(?:$|[^.A-Za-z0-9_]))'''
tags = ["oauth", "secret"]

[[rules]]
id = "session-cookie-secret"
description = "Session cookie signing secret (≥32 base64-ish chars)"
regex = '''(?i)SESSION_COOKIE_SECRET\s*[:=]\s*["']?[A-Za-z0-9+/=]{32,}["']?'''
tags = ["session", "secret"]

[[rules]]
id = "token-encryption-key"
description = "AES-256-GCM key used to encrypt Meta tokens at rest (64 hex)"
regex = '''(?i)TOKEN_ENCRYPTION_KEY\s*[:=]\s*["']?[A-Fa-f0-9]{64}["']?'''
tags = ["encryption", "key"]

[[rules]]
id = "mcp-api-key-assignment"
description = "MCP service-to-service API key (≥32 chars)"
# Tightened from 20 to 32 — production keys we mint are 64 hex chars,
# so 32 is a safe lower bound that excludes test fixtures.
regex = '''(?i)MCP_API_KEY\s*[:=]\s*["']?[A-Za-z0-9]{32,}["']?'''
tags = ["api", "key"]

[[rules]]
id = "google-oauth-token"
description = "Google OAuth access token (ya29.<...>)"
regex = '''ya29\.[0-9A-Za-z_-]{30,}'''
tags = ["gcp", "token"]

[[rules]]
id = "google-api-key-meta-ads-mcp"
description = "Google API key (AIza prefix)"
regex = '''AIza[0-9A-Za-z_-]{35}'''
tags = ["gcp", "key"]

[[rules]]
id = "gcp-service-account-private-key"
description = "GCP service account JSON containing a private key"
regex = '''"private_key"\s*:\s*"-----BEGIN'''
tags = ["gcp", "key"]

[[rules]]
id = "private-key-block"
description = "Generic private key block (RSA/EC/DSA/OpenSSH/PGP)"
# Real keys are followed by base64 line(s); require at least one base64
# line (≥32 chars) within 200 chars after the BEGIN marker so a doc that
# just mentions the marker in prose / code-fence doesn't trigger.
regex = '''-----BEGIN(\s+(RSA|EC|DSA|OPENSSH|PGP|ENCRYPTED))?\s+PRIVATE KEY-----[\s\S]{0,200}?[A-Za-z0-9+/=]{32,}'''
tags = ["key", "pem"]

# ──────────────────────────────────────────────────────────────────────
# Allowlist
# Quirurgical: documented examples, lockfiles, and the local .env
# (which is always gitignored). DO NOT allowlist whole markdown files
# or test directories — secrets routinely leak through README updates,
# log lines, debug output, and test fixtures.
# Use `# gitleaks:allow` inline comments for intentional pattern
# documentation in markdown.
# ──────────────────────────────────────────────────────────────────────

[allowlist]
description = "global allowlist for documented examples, lockfiles, and local env"
# Historical commits with test-only fixture values that pre-date the
# current fixture conventions (`test-*`, `placeholder`, `fixture`).
# The current main versions of these test files use allowlisted patterns.
# DO NOT extend this list to suppress findings in NEW commits — fix the
# fixture instead.
commits = [
  "245fa2cf1aa2aa43f80044ca206888e61e73eaf0",
  "79c5edcc82f8c5fa79b75d4bf16e6c14c785a0ad",
]
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env(\..*)?$''',
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)\.gitleaks-baseline\.json$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)yarn\.lock$''',
]
# EVERY entry below MUST start with an explicit (?i) or (?-i).
#
# gitleaks >= ~8.30 joins these into a single alternation, so a bare inline
# (?i) leaks into every regex that follows it and silently widens the
# allowlist. That is not theoretical: it made `test[-_]?(token|secret|key)`
# case-insensitive, which allowlisted a real-looking `apify_api_TESTtoken…`
# value that gitleaks 8.24.3 (what CI runs) correctly flagged. The two
# spellings of `placeholder` below are the tell that case-sensitivity was
# always the intent here.
#
# Stating the flag on each entry makes the list mean the same thing on every
# gitleaks version, regardless of ordering.
regexes = [
  # Common placeholder values used in docs and examples.
  '''(?i)YOUR_(META|OAUTH|TOKEN|SESSION|MCP|API)_[A-Z_]+''',
  '''(?i)EXAMPLE_(SECRET|KEY|TOKEN)''',
  '''(?i)<your-[a-z-]+>''',
  # Synthetic values used in tests — clearly not real secrets. Case-sensitive
  # on purpose: an uppercase TEST/DUMMY inside an otherwise real-looking
  # credential must NOT buy an exemption.
  '''(?-i)dummy[-_]?(token|secret|key)''',
  '''(?-i)test[-_]?(token|secret|key)''',
  '''(?-i)fixture''',
  '''(?-i)placeholder''',
  '''(?-i)PLACEHOLDER''',
]
