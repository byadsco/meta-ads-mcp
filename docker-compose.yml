services:
  meta-ads-mcp:
    build: .
    ports:
      - "3000:3000"
    environment:
      - SERVER_URL=${SERVER_URL:-http://localhost:3000}
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_OAUTH_REDIRECT_URI=${META_OAUTH_REDIRECT_URI:-}
      - AUTH_ALLOWED_EMAILS=${AUTH_ALLOWED_EMAILS:-}
      - AUTH_ALLOWED_DOMAINS=${AUTH_ALLOWED_DOMAINS:-}
      - AUTH_ALLOWED_FB_USER_IDS=${AUTH_ALLOWED_FB_USER_IDS:-}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      - SESSION_COOKIE_SECRET=${SESSION_COOKIE_SECRET:-}
      - OAUTH_SECRET=${OAUTH_SECRET:-}
      - FIRESTORE_PROJECT_ID=${FIRESTORE_PROJECT_ID:-}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - FIRESTORE_EMULATOR_HOST=${FIRESTORE_EMULATOR_HOST:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_TOKENS=${META_TOKENS:-}
      - MCP_API_KEY=${MCP_API_KEY:-}
      - APIFY_TOKEN=${APIFY_TOKEN:-}
      - META_API_VERSION=${META_API_VERSION:-v26.0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - FFMPEG_PATH=${FFMPEG_PATH:-}
      - FFPROBE_PATH=${FFPROBE_PATH:-}
      - VIDEO_MAX_BYTES=${VIDEO_MAX_BYTES:-}
      - VIDEO_MAX_SECONDS=${VIDEO_MAX_SECONDS:-}
      - VIDEO_MAX_CONCURRENT_JOBS=${VIDEO_MAX_CONCURRENT_JOBS:-2}
      - VIDEO_CALL_BUDGET_MS=${VIDEO_CALL_BUDGET_MS:-}
      - VIDEO_JOBS_PER_TENANT_PER_HOUR=${VIDEO_JOBS_PER_TENANT_PER_HOUR:-}
      - VIDEO_ALLOWED_HOST_SUFFIXES=${VIDEO_ALLOWED_HOST_SUFFIXES:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - GEMINI_INLINE_MAX_BYTES=${GEMINI_INLINE_MAX_BYTES:-}
      - GEMINI_MAX_UPLOAD_BYTES=${GEMINI_MAX_UPLOAD_BYTES:-}
      - GEMINI_ANALYSES_PER_TENANT_PER_HOUR=${GEMINI_ANALYSES_PER_TENANT_PER_HOUR:-20}
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
    # Scratch space for video jobs, in memory and size-limited like the Cloud
    # Run volume, so an oversize write fails with ENOSPC instead of filling disk.
    tmpfs:
      - /tmp:size=768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
