# Dependabot config for meta-ads-mcp.
#
# - npm: weekly grouped updates; ignore major bumps for the MCP SDK
#   (those need manual review of the protocol change) and for two dev
#   dependencies whose next major cannot be taken here yet; each entry
#   below says what has to change before it is lifted.
# - github-actions: weekly, all in one PR so SHA-pinned actions can be
#   upgraded in lockstep.
# - docker: weekly for the base image referenced in the Dockerfile; Node
#   majors are ignored there, since the runtime moves by hand with engines.
#   Docker has version updates only; the security updates below do not
#   cover the image.
#
# Security updates run continuously regardless of this schedule (driven by
# GitHub Advisory Database). Verified via `gh api repos/byadsco/meta-ads-mcp/automated-security-fixes`.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - npm
    groups:
      dev-dependencies:
        dependency-type: development
      typescript:
        patterns:
          - "typescript"
          - "tsx"
          - "@types/*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
    ignore:
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types: ["version-update:semver-major"]
      # A TypeScript major deserves a manual look like the MCP SDK's does,
      # and right now one cannot even install: typescript-eslint's peer
      # range is ">=4.8.4 <6.1.0" as of 8.70.0, so TypeScript 7 fails npm ci
      # with ERESOLVE and takes the whole grouped PR down with it. This
      # rule also holds back a 6.x, which that range would admit; lift it
      # when typescript-eslint's peer range covers the major on offer and
      # someone has read the release notes.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node 26 installs fine without a Node 26 anywhere: it declares
      # APIs, it does not provide them. The image and engines are both Node
      # 22; typing against Node 26 would describe APIs that exist nowhere the
      # code runs. Lift with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - docker
    ignore:
      # The Node major in the image is the runtime, and moving it is a
      # decision taken with engines.node, the workflows' node-version and the
      # docs, in one PR, the way the move to 22 was. Dependabot's docker
      # ecosystem has no notion of LTS: it proposed node:26 while 26 was
      # still Current, months before it becomes LTS. This rule is permanent:
      # bump the runtime by hand when adopting the next LTS and keep the
      # rule, since removing it reopens automatic majors. Two things it does
      # not change: Dependabot does not compare tags across these Alpine
      # suffixes, so a bump from 22-alpine3.24 to 22-alpine3.25 is a manual
      # edit regardless; and Node minors and patches inside the floating "22"
      # tag arrive with the next image build, not through a PR. Docker gets
      # version updates only, no advisory-driven security updates, so a fix
      # published under the same tag also needs a rebuild and redeploy.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
