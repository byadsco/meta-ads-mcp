name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          CI: '1'
        run: npm test

      - name: Build
        run: npm run build

  secret-scan:
    name: gitleaks (secret scan)
    # Required check: the job must always run so it can report a
    # status. Skip only the inner steps for fork PRs, where GitHub
    # withholds org secrets (GITLEAKS_LICENSE) and gitleaks-action
    # aborts before scanning. Push to main and PRs from internal
    # branches scan normally. Fork contributions are still covered
    # by maintainers running pre-deploy-guard locally on the
    # merged result.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip notice (fork PR)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "Skipping gitleaks scan — PR from fork (org secrets unavailable). Push to main will re-scan."

      - name: Checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0

      # Single source of truth for the scanner version, shared with the local
      # guard in .github/pre-deploy-guard/. Left unpinned, the action supplies
      # its own default (8.24.3), which drifts from whatever contributors have
      # installed — and gitleaks versions genuinely disagree about allowlist
      # semantics, so a green local scan stopped predicting CI.
      - name: Resolve pinned gitleaks version
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          version="$(tr -d '[:space:]' < .gitleaks-version)"
          # .gitleaks-version is checked-out repo content, so treat it as
          # untrusted before it reaches GITHUB_ENV: anything but a bare
          # x.y.z could smuggle extra variables into the job environment.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::.gitleaks-version must contain a bare semver (got: $version)"
            exit 1
          fi
          echo "GITLEAKS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run gitleaks
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: ${{ env.GITLEAKS_VERSION }}
